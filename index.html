<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c91524">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TNTT Châu Thủy">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>TNTT Châu Thủy</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5;font-family:Arial,sans-serif}
    #app{position:fixed;inset:0;background:#fff}
    #gasFrame{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#c91524 0,#ef3340 42%,#fff 42%);transition:.2s}
    #loading.hide{opacity:0;pointer-events:none}
    .box{width:min(390px,90vw);background:#fff;border-radius:24px;padding:25px 20px;text-align:center;
      box-shadow:0 15px 45px rgba(0,0,0,.18)}
    .logo{width:72px;height:72px;border-radius:20px;background:#fff;margin:auto;display:grid;place-items:center;
      font-size:38px;border:1px solid #eee}
    h1{font-size:21px;color:#c91524;margin:12px 0 6px}
    p{color:#666;font-size:13px;line-height:1.5;margin:5px 0}
    .spin{width:30px;height:30px;border:3px solid #eee;border-top-color:#c91524;border-radius:50%;
      animation:sp 1s linear infinite;margin:16px auto 8px}
    @keyframes sp{to{transform:rotate(360deg)}}
    #err{display:none;color:#b40000;background:#fff0f0;border-radius:12px;padding:10px;margin-top:10px;font-size:12px}
    button{display:none;width:100%;border:0;border-radius:13px;padding:12px;background:#c91524;color:#fff;
      font-weight:800;margin-top:9px}
  </style>
</head>
<body>
<div id="app">
  <iframe id="gasFrame" title="TNTT Châu Thủy"></iframe>
</div>
<div id="loading">
  <div class="box">
    <div class="logo">✝️</div>
    <h1>TNTT CHÂU THỦY</h1>
    <p>Đang mở hệ thống quản lý...</p>
    <div class="spin"></div>
    <div id="err"></div>
    <button id="retry">THỬ LẠI</button>
  </div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyAZ0BdDGRlEBVzNPlbtOlIAwwzRTYig-sbZiVe91LDtkt92O3G5VAzqrnouqigN4k/exec';
const frame = document.getElementById('gasFrame');
const loading = document.getElementById('loading');
const err = document.getElementById('err');
const retry = document.getElementById('retry');

function openApp(){
  err.style.display='none';
  retry.style.display='none';
  loading.classList.remove('hide');
  frame.src = GAS_URL + (GAS_URL.includes('?')?'&':'?') + 'pwa=1&t=' + Date.now();
}
frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),250));
frame.addEventListener('error',()=>{
  err.textContent='Không mở được hệ thống Apps Script. Kiểm tra Web App /exec.';
  err.style.display='block';
  retry.style.display='block';
});
retry.onclick=openApp;
openApp();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
