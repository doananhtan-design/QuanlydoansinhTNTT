<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c91524">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>TNTT Châu Thủy</title>
<style>
:root{--red:#c91524;--bg:#f5f6f8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#222}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}
.login-title{text-align:center;color:var(--red);margin:8px 0 4px}
.app-version{text-align:center;color:var(--red);font-size:13px;font-weight:700;margin:5px 0 18px}
.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}
.login-input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.login-btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:16px;margin-top:10px}
.login-btn:disabled{opacity:.6}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#f3f3f3;font-size:14px}
.hidden{display:none!important}
.app{min-height:100vh}.top{background:var(--red);color:#fff;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:10px;background:#fff}
.brand-title{font-weight:900}.brand-sub{font-size:12px;opacity:.9}.brand-version{font-size:11px;font-weight:700;margin-top:2px}
.content{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.app-footer-version{text-align:center;padding:12px 10px 20px;color:#888;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div id="login" class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">TNTT CHÂU THỦY</h1>
    <div class="app-version js-app-version">TNTT Châu Thủy • v2.1.0</div>
    <p>Đăng nhập hệ thống quản lý</p>
    <div class="field"><label>Tên đăng nhập</label><input id="u" class="login-input" autocomplete="username"></div>
    <div class="field"><label>Mật khẩu</label><input id="p" class="login-input" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="login-btn" onclick="login()">ĐĂNG NHẬP</button>
    <div id="lm" class="msg hidden" aria-live="polite"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="brand-title">TNTT VIỆT NAM</div>
        <div class="brand-sub">Thiếu Nhi Thánh Thể</div>
        <div class="brand-version js-app-version">TNTT Châu Thủy • v2.1.0</div>
      </div>
    </div>
  </header>
  <main class="content">
    <div class="card"><h2>TNTT Châu Thủy</h2><p>PWA v2.1.0 đã sẵn sàng.</p></div>
  </main>
  <footer class="app-footer-version js-app-version">TNTT Châu Thủy • v2.1.0</footer>
</div>

<script src="./config.js"></script>
<script>
const APP_VERSION = window.TNTT_CONFIG?.VERSION || '2.1.0';
const APP_VERSION_TEXT = window.TNTT_CONFIG?.VERSION_TEXT || ('TNTT Châu Thủy • v'+APP_VERSION);
document.querySelectorAll('.js-app-version').forEach(el=>el.textContent=APP_VERSION_TEXT);

function msg(t,err=false){
  const e=document.getElementById('lm');
  e.textContent=t;e.classList.remove('hidden');
  e.style.color=err?'#b00020':'#333';
}
function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const b=document.getElementById('loginBtn');
  if(!u||!p){msg('Vui lòng nhập tên đăng nhập và mật khẩu.',true);return}
  b.disabled=true;b.textContent='⏳ ĐANG ĐĂNG NHẬP...';
  msg('🔄 Đang khởi tạo kết nối máy chủ...');
  setTimeout(()=>msg('🌐 Đã kết nối máy chủ. Đang kiểm tra tài khoản...'),500);
  setTimeout(()=>msg('🔐 Đang xác thực tài khoản '+u+'...'),1000);
  setTimeout(()=>msg('⚠️ Bridge/API chưa được kết nối trong bản đóng gói mẫu. Hãy cấu hình backend Apps Script.'),1600);
  setTimeout(()=>{b.disabled=false;b.textContent='ĐĂNG NHẬP'},2200);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
