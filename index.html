:root{
  --red:#c91524;--red2:#ef3340;--red3:#8d0e18;--yellow:#ffd83d;

body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}

function ensureBridge(){
  if(window.google?.script?.run) return Promise.resolve();
  if(bridgeReadyPromise)return bridgeReadyPromise;
  bridgeReadyPromise=new Promise((resolve,reject)=>{
    const url=(window.TNTT_CONFIG?.GAS_URL||'').trim();
    if(!url){reject(new Error('Chưa cấu hình URL Apps Script (GAS_URL).'));return}
    const f=document.createElement('iframe');
    f.title='TNTT Apps Script Bridge';f.setAttribute('aria-hidden','true');
    f.style.cssText='position:fixed;width:1px;height:1px;border:0;opacity:0;pointer-events:none;left:-10px;top:-10px';
    let done=false;
    const finish=()=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);resolve();};
    const onMessage=e=>{const d=e.data||{};if(d.type==='TNTT_BRIDGE_READY'||d.type==='TNTT_BRIDGE_PONG')finish();};
    const timer=setTimeout(()=>{window.removeEventListener('message',onMessage);reject(new Error('Không kết nối được Bridge Apps Script. Hãy kiểm tra Deploy Web App và Bridge.html.'))},15000);
    window.addEventListener('message',onMessage);
    f.onload=()=>{
      const msg={type:'TNTT_BRIDGE_PING'};
      try{f.contentWindow.postMessage(msg,'*')}catch(_){}
      try{
        const frames=f.contentWindow.frames;
        for(let i=0;i<frames.length;i++)try{frames[i].postMessage(msg,'*')}catch(_){}
      }catch(_){}
    };
    f.src=url+(url.includes('?')?'&':'?')+'bridge=1&v=2.1.5';
    document.body.appendChild(f);bridgeFrame=f;
  });
  return bridgeReadyPromise;
}
window.addEventListener('message',e=>{
  const d=e.data||{};if(d.type!=='TNTT_BRIDGE_RESULT')return;
  const p=bridgePending.get(d.id);if(!p)return;
  clearTimeout(p.timer);bridgePending.delete(d.id);
  d.ok?p.resolve(d.result):p.reject(new Error(d.error||'Lỗi Apps Script'));
});
function bridgeCall(fn,...args){
  return ensureBridge().then(()=>new Promise((resolve,reject)=>{
    const id=++bridgeSeq;const timer=setTimeout(()=>{bridgePending.delete(id);reject(new Error('Apps Script không phản hồi sau 20 giây.'))},20000);
    bridgePending.set(id,{resolve,reject,timer});
    try{
      const msg={type:'TNTT_BRIDGE_CALL',id,fn,args};
      try{bridgeFrame.contentWindow.postMessage(msg,'*')}catch(_){}
      try{
        const frames=bridgeFrame.contentWindow.frames;
        for(let i=0;i<frames.length;i++)try{frames[i].postMessage(msg,'*')}catch(_){}
      }catch(_){}
    }catch(e){clearTimeout(timer);bridgePending.delete(id);reject(e)}
  }));
}
function call(fn,...args){
  if(window.google?.script?.run){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
  return bridgeCall(fn,...args);

async function login(){
  const btn=document.querySelector('.login-btn');
  const u=$('u').value.trim(),p=$('p').value;
  if(!u||!p){loginProgress('⚠️ Vui lòng nhập tên đăng nhập và mật khẩu.',true);return}
  try{
    if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='⏳ ĐANG ĐĂNG NHẬP...'}
    loginProgress('🔄 Đang khởi tạo kết nối máy chủ...');
    await ensureBridge();
    loginProgress('🌐 Đã kết nối máy chủ. Đang kiểm tra tài khoản...');
    const r=await call('login',{tenDangNhap:u,matKhau:p});
    loginProgress('🔐 Xác thực thành công. Đang tạo phiên đăng nhập...');
    token=r.token;sessionStorage.tnttToken=token;sessionStorage.tnttGreeting='';
    loginProgress('📥 Đăng nhập thành công. Đang tải dữ liệu...');
    await start(r.user);
    loginProgress('📊 Đang tải thông tin ngành, thành viên và điểm danh...');
    await new Promise(r=>setTimeout(r,120));
    $('lm').classList.add('hidden');
  }catch(e){
    const msg=String(e?.message||e||'Lỗi không xác định');
    loginProgress(msg.includes('Sai tai khoan')||msg.includes('mật khẩu')?'❌ Tên đăng nhập hoặc mật khẩu không đúng.':'❌ Đăng nhập thất bại: '+msg,true);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.oldText||'ĐĂNG NHẬP'}
  }

async function home(){if(isAdminUser()){return adminHome()}const d=await refresh();screenEl.innerHTML=`${pagebar('Trang chủ','home')}<div class="admin-hero"><h2>🎉 Chào mừng bạn!</h2><p>Quản lý TNTT nhanh chóng trên điện thoại • Điểm danh QR trong vài giây.</p></div><div class="stats"><div class="stat"><span>Đoàn sinh</span><b>${d.ds}</b></div><div class="stat"><span>Huynh trưởng</span><b>${d.ht}</b></div><div class="stat"><span>Đã điểm danh</span><b>${d.todayAttendance}</b></div><div class="stat"><span>Vắng</span><b id="svang">—</b></div></div>${FD.user.VAI_TRO==='TRUONG_NGANH'?`<div class="card leader-add-card"><div class="leader-add-title">➕ THÊM THÀNH VIÊN NGÀNH ${esc(FD.user.MA_NGANH||'')}</div><div class="industry-lock">🔒 Ngành tự động theo tài khoản đăng nhập. Mọi thành viên mới chỉ thuộc ngành này.</div><div class="add-actions"><button class="add-big ds" onclick="addDS()"><span class="add-ico">👥</span><span>＋ THÊM ĐOÀN SINH</span><small>Thêm vào ngành ${esc(FD.user.MA_NGANH||'')}</small></button><button class="add-big ht" onclick="addHT()"><span class="add-ico">👤</span><span>＋ THÊM HUYNH TRƯỞNG</span><small>Thêm vào ngành ${esc(FD.user.MA_NGANH||'')}</small></button></div></div>`:''}<div class="grid2"><button class="tile red" onclick="members()"><span class="ico">👥</span>THÀNH VIÊN<small>Đoàn sinh & Huynh trưởng</small></button><button class="tile yellow" onclick="addMember()"><span class="ico">➕</span>${isAdminUser()?"THÊM HUYNH TRƯỞNG":"THÊM THÀNH VIÊN"}<small>${isAdminUser()?"Tài khoản Admin/Đoàn trưởng":"Chọn Đoàn sinh hoặc Huynh trưởng"}</small></button><button class="tile green" onclick="scanner()"><span class="ico">▣</span>QUÉT QR<small>Điểm danh nhanh</small></button><button class="tile blue" onclick="today()"><span class="ico">📋</span>ĐIỂM DANH<small>Xem danh sách hôm nay</small></button><button class="tile purple" onclick="stats()"><span class="ico">📊</span>THỐNG KÊ<small>Thống kê ngành</small></button>${FD.user.VAI_TRO==='TRUONG_NGANH'?'<button class="tile yellow" onclick="manageDoi()"><span class="ico">🏕️</span>QUẢN LÝ ĐỘI<small>Tạo đội & chuyển thành viên</small></button>':''}<button class="tile red" onclick="absenceReportUI(FD.user.MA_NGANH)"><span class="ico">⚠️</span>BÁO CÁO VẮNG<small>Xem người vắng</small></button></div><div class="card"><h2>📱 HƯỚNG DẪN ĐIỂM DANH</h2><div style="font-size:13px;line-height:1.9">1️⃣ Thành viên mở hồ sơ → <b>Tạo QR</b>.<br>2️⃣ Trưởng ngành mở <b>Quét QR</b>.<br>3️⃣ Đưa mã QR vào khung camera.<br>4️⃣ Hệ thống tự ghi nhận thời gian và trạng thái.</div></div>`;try{const st=await call('statsNganh',token,dateToday());const me=st.find(x=>x.maNganh===FD.user.MA_NGANH);if(me&&$('svang'))$('svang').textContent=me.vang}catch(e){}}async function members(){try{const d=await call('listMembers',token);if(!d||typeof d!=='object'){throw new Error('Máy chủ không trả dữ liệu danh sách thành viên. Hãy cập nhật GS mới nhất và Deploy lại Web App.');}allMembers={ds:Array.isArray(d.ds)?d.ds:[],ht:Array.isArray(d.ht)?d.ht:[],user:d.user||FD?.user||null};let tab='all';const role=FD?.user?.VAI_TRO||'';let addBtn='';if(['ADMIN','DOAN_TRUONG'].includes(role)){addBtn='<div class="add-actions" style="width:100%"><button class="add-big ht" onclick="addHT()"><span class="add-ico">👤</span><span>THÊM HUYNH TRƯỞNG</span><small>Quản lý HT</small></button></div>';}else if(role==='TRUONG_NGANH'){addBtn='<div class="add-actions" style="width:100%"><button class="add-big ds" onclick="addDS()"><span class="add-ico">👥</span><span>THÊM ĐOÀN SINH</span><small>Ngành '+esc(FD.user.MA_NGANH||'')+'</small></button><button class="add-big ht" onclick="addHT()"><span class="add-ico">👤</span><span>THÊM HUYNH TRƯỞNG</span><small>Ngành '+esc(FD.user.MA_NGANH||'')+'</small></button></div>';}screenEl.innerHTML=`${pagebar('Thành viên','home')}<div class="card"><div style="display:flex;align-items:center;gap:7px"><h2 style="flex:1;margin:0">👥 Thành viên</h2><button class="outline" onclick="home()">← Trang chủ</button><button class="secondary" onclick="logout()">Thoát</button></div>${addBtn}<input id="search" style="margin-top:10px" placeholder="🔎 Tìm theo họ tên, mã..." oninput="renderMemberList()"><div class="tabs"><button onclick="tab='all';renderMemberList()">Tất cả</button><button onclick="tab='ds';renderMemberList()">Đoàn sinh</button><button onclick="tab='ht';renderMemberList()">Huynh trưởng</button></div><div id="memberList"></div></div>`;window.tab=tab;renderMemberList()}catch(e){console.error('LỖI LIST MEMBERS',e);alert('Không tải được danh sách thành viên: '+(e.message||e));}}
function renderMemberList(){let type=window.tab||'all',q=($('search')?.value||'').toLowerCase();let arr=[];const ds=Array.isArray(allMembers?.ds)?allMembers.ds:[],ht=Array.isArray(allMembers?.ht)?allMembers.ht:[];if(type!=='ht')arr=arr.concat(ds.map(x=>({...x,_type:'DS',_id:x.MA_DS,_loai:'DOAN_SINH'})));if(type!=='ds')arr=arr.concat(ht.map(x=>({...x,_type:'HT',_id:x.MA_HT,_loai:'HUYNH_TRUONG'})));arr=arr.filter(x=>(x.HO_TEN+' '+x._id+' '+x.MA_NGANH).toLowerCase().includes(q));$('memberList').innerHTML=arr.length?arr.map(memberCard).join(''):'<div class="empty">Không có thành viên</div>'}
function memberCard(x){return `<div class="member" style="cursor:pointer" onclick="memberProfileUI('${esc(x._loai)}','${esc(x._id)}')"><img src="${esc(x.ANH_URL||LOGO)}" onerror="this.src='${LOGO}'"><div class="info"><div class="name">${esc(x.TEN_THANH?x.TEN_THANH+' · ':'')}${esc(x.HO_TEN)}</div><div class="meta">${esc(x._id)} · Ngành ${esc(x.MA_NGANH)} · ${esc(x.GIAO_HO||'')} · ${esc(x._type==='DS'?(x.MA_DOI?'Đội '+x.MA_DOI:(x.MA_DOAN||'Chưa đội')):(x.CHUC_VU||'Huynh trưởng'))}</div><small style="color:#b40000">Nhấn để xem hồ sơ</small></div><div class="member-actions"><button class="outline" onclick="event.stopPropagation();showQR('${esc(x._loai)}','${esc(x._id)}','${esc(x.HO_TEN)}')">▣</button><button onclick="event.stopPropagation();updatePhotoUI('${esc(x._loai)}','${esc(x._id)}','${esc(x.HO_TEN)}')">📷</button></div></div>`}

async function requestAddCamera(){
  const video=$('addCameraVideo'),msg=$('addCameraMsg'),allow=$('allowCameraBtn'),take=$('takeAddPhotoBtn'),help=$('cameraPermissionHelp');
  if(!video||!msg)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='❌ Trình duyệt này không hỗ trợ camera trực tiếp.';
    if(help){help.classList.remove('hidden');help.textContent='Bạn có thể dùng nút Tải ảnh lên bên dưới.';}
    allow?.classList.add('hidden');take?.classList.add('hidden');return;
  }
  try{
    msg.textContent='📷 Đang xin quyền camera. Hãy bấm “Cho phép” trên thông báo của trình duyệt.';
    addPhotoStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
    });
    video.srcObject=addPhotoStream;
    msg.textContent='✅ Camera sau đã được cấp quyền. Đưa khuôn mặt vào khung rồi bấm CHỤP ẢNH.';
    allow?.classList.add('hidden');take?.classList.remove('hidden');help?.classList.add('hidden');
  }catch(e){
    console.error('CAMERA_PERMISSION',e);
    let detail='Trình duyệt chưa cho phép camera.';
    if(e?.name==='NotAllowedError')detail='Quyền camera đang bị từ chối. Hãy bấm biểu tượng 🔒 cạnh địa chỉ trang → Camera → Cho phép, sau đó bấm “MỞ CAMERA”.';
    else if(e?.name==='NotFoundError')detail='Không tìm thấy camera trên thiết bị.';
    else if(e?.name==='NotReadableError')detail='Camera đang được ứng dụng khác sử dụng.';
    else if(location.protocol!=='https:')detail='Camera cần trang HTTPS. Hãy mở đúng Web App HTTPS.';
    msg.textContent='❌ '+detail;
    if(help){help.classList.remove('hidden');help.innerHTML='🔐 <b>Cách cấp quyền:</b> mở cài đặt quyền Camera của trình duyệt cho trang này → chọn <b>Cho phép</b> → quay lại và bấm “MỞ CAMERA”.<br>Hoặc dùng <b>TẢI ẢNH LÊN</b> bên dưới.';}
    allow?.classList.remove('hidden');take?.classList.add('hidden');
  }
}

function uploadAddPhoto(input){
  const file=input?.files?.[0];
  if(!file)return;
  compressPhoto(file).then(data=>{
    addPhotoData=data;
    const video=$('addCameraVideo'),preview=$('addPhotoPreview'),img=$('addPhotoImg'),msg=$('addCameraMsg'),take=$('takeAddPhotoBtn'),retake=$('retakeAddPhotoBtn');
    if(img)img.src=data;
    preview?.classList.remove('hidden');
    video?.classList.add('hidden');
    take?.classList.add('hidden');
    retake?.classList.remove('hidden');
    if(msg)msg.textContent='✅ Đã tải ảnh. Kiểm tra ảnh rồi nhập thông tin bên dưới.';
    if(addPhotoStream){addPhotoStream.getTracks().forEach(t=>t.stop());addPhotoStream=null;}
    showAddMemberFields();
  }).catch(e=>alert('❌ Không đọc được ảnh: '+(e.message||e)));

function showAddMemberFields(){

async function takeAddPhoto(){
  const video=$('addCameraVideo'),canvas=$('addCameraCanvas');
  if(!video||!canvas||!video.videoWidth){alert('Camera chưa sẵn sàng. Nếu không mở được camera, hãy dùng TẢI ẢNH LÊN.');return;}
  const maxSide=900;let w=video.videoWidth,h=video.videoHeight,scale=Math.min(1,maxSide/Math.max(w,h));
  w=Math.round(w*scale);h=Math.round(h*scale);canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(video,0,0,w,h);
  addPhotoData=canvas.toDataURL('image/jpeg',.78);
  $('addPhotoImg').src=addPhotoData;$('addPhotoPreview').classList.remove('hidden');
  video.classList.add('hidden');$('takeAddPhotoBtn').classList.add('hidden');$('retakeAddPhotoBtn').classList.remove('hidden');
  $('addCameraMsg').textContent='✅ Đã chụp ảnh. Kiểm tra ảnh rồi nhập thông tin bên dưới.';
  if(addPhotoStream){addPhotoStream.getTracks().forEach(t=>t.stop());addPhotoStream=null;}
  showAddMemberFields();
}

async function compressPhoto(file,maxSide=900,quality=.72){return new Promise((resolve,reject)=>{if(!file){resolve('');return}const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=fr.result};fr.readAsDataURL(file)})}
async function saveMemberUI(type){
  if(addMemberBusy){
    const left=Math.max(0,60-Math.floor((Date.now()-addMemberFirstClickAt)/1000));
    alert('⏳ Đang xử lý. Vui lòng chờ '+left+' giây rồi thao tác lại.');

  }
  addMemberBusy=true;

  try{
    if(!addPhotoData)throw Error('Vui lòng chụp ảnh hoặc tải ảnh lên trước khi lưu');

    if(!hoTen)throw Error('Vui lòng nhập Họ và tên');

    const p={

    };

    // Kiểm tra trùng trước khi ghi: Họ tên + ngày sinh + cha/mẹ.
    const check=await call('checkMemberDuplicate',token,p);
    if(check?.duplicate){
      const msg=[
        '⚠️ PHÁT HIỆN THÔNG TIN CÓ THỂ TRÙNG',
        '',
        check.reason||'Đã có thành viên có thông tin tương tự.',
        check.existing?.hoTen?'Đã có: '+check.existing.hoTen:'',
        check.existing?.ngaySinh?'Ngày sinh: '+check.existing.ngaySinh:'',

      ].filter(Boolean).join('\n');

    await call(type==='DS'?'saveMember':'saveHuynhTruong',token,p);

    if(addPhotoStream){addPhotoStream.getTracks().forEach(t=>t.stop());addPhotoStream=null;}
    addPhotoData='';
    alert('✅ Đã lưu '+(type==='DS'?'Đoàn sinh':'Huynh trưởng'));
    await refresh();
    await members();

    // Khóa nút LƯU trong 60 giây kể từ lần nhấn đầu tiên.
    const passed=Math.floor((Date.now()-addMemberFirstClickAt)/1000);
    const remaining=Math.max(0,60-passed);
    if(remaining>0){
      await new Promise(r=>setTimeout(r,remaining*1000));
    }
    addMemberBusy=false;
  }catch(e){
    addMemberBusy=false;
    alert('❌ Không thể lưu: '+(e.message||e));
  }
}

function startScannerForMember(id,loai){scanner();window.expectedAttendance={maNguoi:id,loai};}
function openManualAbsent(id,loai){window.manualPending={maNguoi:id,loai};const box=$('manualAttendanceBox');if(!box)return;box.innerHTML=`<div class="manual-att-card"><b>❌ Chọn tình trạng vắng</b><div class="att-buttons"><button class="att-permit" onclick="showManualReason()">🟢 CÓ PHÉP</button><button class="att-unpermit" onclick="submitManualAttendance('VANG_MAT','KHONG_PHEP','')">🔴 KHÔNG PHÉP</button></div><div id="manualReasonBox" class="hidden"><label>Lý do vắng có phép</label><textarea id="manualReason" placeholder="Nhập lý do..."></textarea><button class="full" onclick="submitManualAttendance('VANG_MAT','CO_PHEP',$('manualReason').value)">XÁC NHẬN CÓ PHÉP</button></div><button class="secondary full" onclick="closeManualAttendance()">HỦY</button></div>`;box.scrollIntoView({behavior:'smooth',block:'center'})}
function showManualReason(){$('manualReasonBox')?.classList.remove('hidden')}
function closeManualAttendance(){window.manualPending=null;if($('manualAttendanceBox'))$('manualAttendanceBox').innerHTML=''}
async function submitManualAttendance(trangThai,phanLoai,lyDo){try{const p=window.manualPending;if(!p)return;await call('confirmAttendance',token,{maNguoi:p.maNguoi,loai:p.loai,ngay:dateToday(),trangThai,phanLoai,lyDo:lyDo||''});closeManualAttendance();await renderAttendanceRoster(dateToday());navigator.vibrate?.(120)}catch(e){alert(e.message||e)}}
async function manualAttendance(id,loai,trangThai){
  if(trangThai!=='CO_MAT')return;
  const ok=confirm('Bạn này đang có mặt?\n\nBấm OK để xác nhận điểm danh.');
  if(!ok)return;
  await submitDirectAttendance(id,loai,'CO_MAT','','');
}
async function submitDirectAttendance(id,loai,trangThai,phanLoai,lyDo){
  try{
    const r=await call('confirmAttendance',token,{maNguoi:id,loai,ngay:dateToday(),trangThai,phanLoai,lyDo});
    if(!r||typeof r!=='object') throw Error('Máy chủ không trả kết quả xác nhận điểm danh.');
    alert('✅ Đã ghi nhận điểm danh: '+(r.hoTen||'thành viên')+'\nTrạng thái: CÓ MẶT');
    await renderAttendanceRoster(dateToday());
    const row=document.querySelector('#attendanceRoster');
    if(row) row.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){
    alert('❌ Không thể ghi nhận điểm danh: '+(e.message||e));
  }
}
function formatTime(v){if(!v)return'';try{return new Date(v).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){return String(v)}}
async function transfer(id){const ht=(Array.isArray(allMembers?.ht)?allMembers.ht:[]).find(x=>x.MA_HT===id);const opts=FD.nganh.map(x=>`<option value="${esc(x.MA_NGANH)}">${esc(x.TEN_NGANH)}</option>`).join('');modal.innerHTML=`<div class="card"><h2>↔ Chuyển ngành</h2><b>${esc(ht?.HO_TEN||id)}</b><div class="field"><label>Ngành mới</label><select id="newNganh">${opts}</select></div><div class="field"><label>Lý do</label><input id="reason" placeholder="Lý do chuyển ngành"></div><button class="full" onclick="doTransfer('${esc(id)}')">XÁC NHẬN CHUYỂN</button><button class="secondary full" onclick="closeModal()">HỦY</button></div>`;modal.classList.remove('hidden')}
async function doTransfer(id){try{await call('transferHuynhTruong',token,{maHt:id,maNganhMoi:$('newNganh').value,lyDo:$('reason').value});closeModal();alert('Đã chuyển ngành');await refresh();members()}catch(e){alert(e.message)}}
async function stats(){if(isAdminUser())return adminHome();try{const d=await call('industryDetail',token,FD.user.MA_NGANH,dateToday());screenEl.innerHTML=`${pagebar('Thống kê ngành','home')}<div class="card"><h2>📊 ${esc(d.nganh)}</h2><div class="stats"><div class="stat"><span>Tổng</span><b>${d.tong}</b></div><div class="stat"><span>Có mặt</span><b>${d.coMat}</b></div><div class="stat"><span>Vắng</span><b class="danger">${d.vang}</b></div><div class="stat"><span>Tỷ lệ</span><b>${d.tyLe}%</b></div></div><button class="full outline" onclick="absenceReportUI('${esc(FD.user.MA_NGANH)}')">⚠️ Xem danh sách vắng</button><button class="full outline" onclick="htStatsUI()">👤 Thống kê Huynh trưởng</button></div>`}catch(e){alert(e.message||e)}}
function account(){screenEl.innerHTML=pagebar('Tài khoản','home')+'<div class="card"><h2>⚙️ Tài khoản</h2><div id="accountInfo"></div><h2 style="margin-top:18px">🔐 Đổi mật khẩu</h2><div class="field"><label>Mật khẩu hiện tại</label><input id="old" type="password"></div><div class="field"><label>Mật khẩu mới</label><input id="newp" type="password"></div><div class="field"><label>Nhập lại mật khẩu mới</label><input id="newp2" type="password"></div><button class="full" onclick="pw()">ĐỔI MẬT KHẨU</button><button class="secondary full" onclick="home()">← QUAY VỀ TRANG CHỦ</button><button class="secondary full" onclick="logout()">⏻ THOÁT VỀ ĐĂNG NHẬP</button></div>';accountInfo.innerHTML=`<b>${esc(FD.user.HO_TEN)}</b><div class="meta">Tài khoản: ${esc(FD.user.TEN_DANG_NHAP)} · ${esc(FD.user.VAI_TRO)}${FD.user.MA_NGANH?' · Ngành '+esc(FD.user.MA_NGANH):''}</div>`}async function pw(){try{await call('changePassword',token,{matKhauCu:$('old').value,matKhauMoi:$('newp').value,nhapLai:$('newp2').value});alert('Đổi mật khẩu thành công')}catch(e){alert(e.message)}}async function logout(){try{await call('logout',token)}catch(e){}sessionStorage.removeItem('tnttToken');token='';location.reload()}
window.addEventListener('error',e=>{console.error(e.error||e.message);const m=$('lm');if(m&&!token){m.textContent='Lỗi giao diện: '+(e.message||'Không xác định');m.classList.remove('hidden')}});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);alert((e.reason&&e.reason.message)||'Có lỗi khi thực hiện thao tác.');});
setLogo();auto();</script></body></html>
